<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo</title><link rel="stylesheet" href="../fonts/fonts.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--tx)}
.app{display:grid;grid-template-columns:232px 1fr;height:100vh;overflow:hidden}
.side{background:var(--side);color:var(--sidetx);padding:22px 14px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px;font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--pri);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:14px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--sidemu);transition:.25s}
.nav svg{width:17px;height:17px;flex:none}
.nav.on{background:var(--navon);color:var(--sidetx)}
.side .sp{flex:1}
.user{display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line);margin-top:8px;font-size:13px}
.av{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex:none}
.main{overflow:hidden;display:flex;flex-direction:column;min-width:0}
.top{height:64px;display:flex;align-items:center;gap:16px;padding:0 28px;border-bottom:1px solid var(--line);background:var(--topbg)}
.top h1{font-size:19px;margin:0;font-weight:650;letter-spacing:-.01em;flex:1}
.search{width:280px;height:38px;border-radius:10px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;padding:0 12px;gap:8px;color:var(--mu);font-size:13px}
.btn{height:38px;padding:0 16px;border-radius:10px;background:var(--pri);color:#fff;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.body{padding:24px 28px;display:flex;flex-direction:column;gap:18px;overflow:hidden;flex:1}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--sh)}
.kpi .l{font-size:12.5px;color:var(--mu);font-weight:500}
.kpi .v{font-size:27px;font-weight:650;letter-spacing:-.02em;margin:8px 0 6px}
.up{font-size:12px;font-weight:600;color:var(--ok);background:var(--okbg);padding:3px 8px;border-radius:99px}
.dn{font-size:12px;font-weight:600;color:#c2410c;background:#fff1e6;padding:3px 8px;border-radius:99px}
.row2{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;min-height:0}
.ch h3,.card h3{margin:0 0 4px;font-size:14.5px;font-weight:620}
.card .sub{font-size:12px;color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11.5px;font-weight:600;color:var(--mu);padding:9px 10px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em}
td{padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.pill{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:99px;display:inline-block}
.p-ok{background:var(--okbg);color:var(--ok)}.p-w{background:#fff6dd;color:#a16207}.p-i{background:#e8f0ff;color:#2952b3}.p-r{background:#fde8e8;color:#b42318}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);border-radius:99px}
.fade{animation:fu .6s both}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.draw{stroke-dasharray:2000;stroke-dashoffset:2000;animation:dr 1.6s .2s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
#cursor{position:fixed;left:0;top:0;width:22px;height:22px;z-index:99;pointer-events:none;transition:transform .9s cubic-bezier(.6,.05,.3,1);display:none}
#cursor.click::after{content:"";position:absolute;left:-10px;top:-10px;width:40px;height:40px;border-radius:50%;background:rgba(80,120,255,.25);animation:ck .5s}
@keyframes ck{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
/* móvil */
.phone{height:100vh;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;position:relative}
.sb{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:600}
.pin{position:absolute;transform:translate(-50%,-100%)}
</style>
